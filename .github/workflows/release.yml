name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test
        run: go test ./...

      - name: Build tether-cli.exe
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o tether-cli.exe .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: tether-cli.exe
          generate_release_notes: true

  build-gui:
    needs: build-cli
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test vault package
        # Scoped to ./vault/... rather than ./...: the main package has a
        # //go:embed of frontend/dist, which doesn't exist yet at this
        # point (it's produced by the wails build step below), so testing
        # the whole module here would fail with "no matching files".
        working-directory: cmd/tether-gui
        run: go test ./vault/...

      - name: Build tether-portable.exe and installer
        working-directory: cmd/tether-gui
        run: wails build -platform windows/amd64 -nsis

      - name: Verify installer was produced and rename to tether-setup.exe
        working-directory: cmd/tether-gui
        run: |
          if (-not (Test-Path "build\bin\tether-gui-amd64-installer.exe")) {
            Write-Error "NSIS installer was not produced (wails build only warns, doesn't fail, if makensis is missing)"
            exit 1
          }
          Move-Item "build\bin\tether-gui-amd64-installer.exe" "build\bin\tether-setup.exe"

      - name: Upload tether-gui to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cmd/tether-gui/build/bin/tether-portable.exe
            cmd/tether-gui/build/bin/tether-setup.exe
