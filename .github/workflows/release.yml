name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v0.3.0"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.23"

      - name: Test
        run: go test ./...

      - name: Build nullssh-cli.exe
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o nullssh-cli.exe .

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: nullssh-cli.exe
          generate_release_notes: true

  build-gui:
    needs: build-cli
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test vault package
        # Scoped to ./vault/... rather than ./...: the main package has a
        # //go:embed of frontend/dist, which doesn't exist yet at this
        # point (it's produced by the wails build step below), so testing
        # the whole module here would fail with "no matching files".
        working-directory: cmd/tether-gui
        run: go test ./vault/...

      - name: Build nullssh-portable.exe and installer
        working-directory: cmd/tether-gui
        run: wails build -platform windows/amd64 -nsis

      - name: Verify installer was produced and rename to nullssh-setup.exe
        working-directory: cmd/tether-gui
        run: |
          if (-not (Test-Path "build\bin\tether-gui-amd64-installer.exe")) {
            Write-Error "NSIS installer was not produced (wails build only warns, doesn't fail, if makensis is missing)"
            exit 1
          }
          Move-Item "build\bin\tether-gui-amd64-installer.exe" "build\bin\nullssh-setup.exe"

      - name: Upload nullssh-gui to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            cmd/tether-gui/build/bin/nullssh-portable.exe
            cmd/tether-gui/build/bin/nullssh-setup.exe
