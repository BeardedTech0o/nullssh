name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test
        run: go test ./...

      - name: Build tether.exe
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o tether.exe .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: tether.exe
          generate_release_notes: true
