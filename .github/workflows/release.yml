name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test
        run: go test ./...

      - name: Build tether.exe
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o tether.exe .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: tether.exe
          generate_release_notes: true

  build-gui:
    needs: build-cli
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Test
        working-directory: cmd/tether-gui
        run: go test ./...

      - name: Build tether-gui.exe
        working-directory: cmd/tether-gui
        run: wails build -platform windows/amd64

      - name: Upload tether-gui.exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: cmd/tether-gui/build/bin/tether-gui.exe
