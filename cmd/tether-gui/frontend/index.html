<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>nullssh</title>
    <script>
        // Applied before first paint so switching themes never flashes the
        // other theme on load. Kept in sync with the "theme" logic in
        // main.js, which is the source of truth for writing this value.
        (function () {
            var saved = localStorage.getItem('tether-theme');
            if (saved === 'light' || saved === 'dark') {
                document.documentElement.setAttribute('data-theme', saved);
            }
        })();
    </script>
</head>
<body>
<div id="app" class="hidden">
    <aside id="sidebar">
        <div id="sidebar-header">
            <span>nullssh</span>
            <div id="sidebar-actions">
                <button id="settings-btn" title="Settings">⚙</button>
                <button id="add-btn" title="Add connection">+</button>
            </div>
        </div>
        <ul id="connection-list"></ul>
    </aside>
    <main id="main">
        <div id="tab-bar">
            <div id="tabs-container"></div>
            <button type="button" id="snippets-btn">Snippets</button>
        </div>
        <div id="terminal-area"></div>
        <div id="empty-state">
            <p>Select a saved connection to start a session.</p>
        </div>
    </main>
</div>

<div id="add-modal" class="modal hidden">
    <form id="add-form" class="modal-card">
        <h2 id="add-modal-title">Add connection</h2>
        <label>Name<input name="name" required autocomplete="off"/></label>
        <label>Host<input name="host" required autocomplete="off"/></label>
        <label>User<input name="user" required autocomplete="off"/></label>
        <label>Port<input name="port" type="number" value="22" required/></label>
        <label>Identity file (optional)
            <span class="input-with-button">
                <input name="identityFile" placeholder="~/.ssh/id_ed25519" autocomplete="off"/>
                <button type="button" id="browse-identity-btn">Browse…</button>
            </span>
        </label>
        <label>Password (optional)
            <input name="password" type="password" placeholder="Leave blank to keep current" autocomplete="new-password"/>
        </label>
        <label id="clear-password-row" class="checkbox-row hidden">
            <input name="clearPassword" type="checkbox"/>
            Remove saved password
        </label>
        <div id="add-error" class="error hidden"></div>
        <div class="modal-actions">
            <button type="button" id="add-cancel">Cancel</button>
            <button type="submit" id="add-submit">Save</button>
        </div>
    </form>
</div>

<div id="snippet-modal" class="modal hidden">
    <form id="snippet-form" class="modal-card">
        <h2 id="snippet-modal-title">Add snippet</h2>
        <label>Category
            <input name="category" list="snippet-category-options" required autocomplete="off" placeholder="e.g. tmux"/>
            <datalist id="snippet-category-options"></datalist>
        </label>
        <label>Label<input name="label" required autocomplete="off" placeholder="e.g. New session"/></label>
        <label>Command<input name="command" required autocomplete="off" placeholder="e.g. tmux new -s mysession"/></label>
        <div id="snippet-error" class="error hidden"></div>
        <div class="modal-actions">
            <button type="button" id="snippet-delete" class="danger hidden">Delete</button>
            <button type="button" id="snippet-cancel">Cancel</button>
            <button type="submit" id="snippet-submit">Save</button>
        </div>
    </form>
</div>

<div id="auth-overlay" class="modal hidden">
    <form id="auth-form" class="modal-card">
        <h2 id="auth-title">Set a master password</h2>
        <p id="auth-description" class="auth-description"></p>
        <label>Master password<input name="password" type="password" required autocomplete="off"/></label>
        <label id="auth-confirm-row">Confirm master password<input name="confirmPassword" type="password" autocomplete="off"/></label>
        <div id="auth-error" class="error hidden"></div>
        <div class="modal-actions">
            <button type="submit" id="auth-submit">Continue</button>
        </div>
    </form>
</div>

<div id="snippets-modal" class="modal hidden">
    <div class="modal-card">
        <h2>Snippets</h2>
        <ul id="snippets-list"></ul>
        <button type="button" id="add-snippet-btn">+ Add snippet</button>
        <div class="modal-actions">
            <button type="button" id="snippets-done">Done</button>
        </div>
    </div>
</div>

<div id="settings-modal" class="modal hidden">
    <div class="modal-card">
        <h2>Settings</h2>
        <label>
            Appearance
            <div class="theme-options">
                <button type="button" class="theme-option" data-theme-value="light">
                    <span class="theme-option-swatch"></span>
                    Light
                </button>
                <button type="button" class="theme-option" data-theme-value="dark">
                    <span class="theme-option-swatch"></span>
                    Dark
                </button>
                <button type="button" class="theme-option" data-theme-value="system">
                    <span class="theme-option-swatch"></span>
                    System
                </button>
            </div>
        </label>
        <div class="modal-actions">
            <button type="button" id="settings-done">Done</button>
        </div>
    </div>
</div>

<script src="./src/main.js" type="module"></script>
</body>
</html>
